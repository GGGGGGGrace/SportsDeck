
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=football_app
    #ports:
    #  - "5433:5432" 
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d football_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-setup:
    build: 
      context: .
      target: builder
    environment:
      - DATABASE_URL=postgresql://postgres:123456@db:5432/football_app
      - MATCH_API_KEY=${MATCH_API_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && 
             npx tsx prisma/syncFootballData.ts && 
             npx prisma db seed"
    

  app:
    build: 
      context: .
      target: runner
    #ports:
    #  - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:123456@db:5432/football_app
      - REDIS_URL=redis://redis:6379
    depends_on:
        db:
          condition: service_healthy
        db-setup:
          condition: service_completed_successfully
        redis:
          condition: service_healthy

    restart: always

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  redis:
    image: redis:7-alpine
    restart: always
    # 生产环境下建议加上密码
    # command: redis-server --requirepass your_redis_password
    #ports:
    #  - "6379:6379"
    healthcheck: # 必须添加
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  db_data: